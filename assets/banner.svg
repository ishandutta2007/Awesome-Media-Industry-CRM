<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1a1438"/></linearGradient><linearGradient id="primary-glow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="badge-grad-1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e1b4b" stop-opacity=".9"/><stop offset="100%" stop-color="#312e81" stop-opacity=".8"/></linearGradient><linearGradient id="badge-grad-2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b0764" stop-opacity=".9"/><stop offset="100%" stop-color="#581c87" stop-opacity=".8"/></linearGradient><linearGradient id="badge-grad-3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#022c22" stop-opacity=".9"/><stop offset="100%" stop-color="#064e3b" stop-opacity=".8"/></linearGradient><linearGradient id="badge-grad-4" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#172554" stop-opacity=".9"/><stop offset="100%" stop-color="#1e3a5f" stop-opacity=".8"/></linearGradient><linearGradient id="beam-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity="0"/><stop offset="50%" stop-color="#a855f7" stop-opacity=".8"/><stop offset="100%" stop-color="#ec4899" stop-opacity="0"/></linearGradient><filter id="glow-blur" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="25"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="subtle-shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="6"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatReverse{0%{transform:translateY(0)}50%{transform:translateY(8px)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes beamSlide{0%{transform:translateX(-600px)}}.anim-pulse{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.anim-float-1{animation:floatSlow 5s ease-in-out infinite}.anim-float-2{animation:floatReverse 6s ease-in-out infinite}.anim-dash{stroke-dasharray:6 6;animation:dashMove 3s linear infinite}.badge-text,.subtitle-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.title-text{font-weight:800;letter-spacing:-.02em}.subtitle-text{font-weight:400;letter-spacing:.01em}.badge-text{font-weight:600;font-size:13px;letter-spacing:.03em}</style></defs><rect width="1200" height="420" fill="url(#bg-grad)" rx="20"/><rect width="1200" height="420" fill="none" stroke="#374151" stroke-opacity=".6" stroke-width="1.5" rx="20"/><g class="anim-pulse" opacity=".45"><circle cx="250" cy="120" r="140" fill="#6366f1" filter="url(#glow-blur)"/><circle cx="950" cy="300" r="160" fill="#a855f7" filter="url(#glow-blur)"/><circle cx="600" cy="210" r="120" fill="#ec4899" filter="url(#glow-blur)" opacity=".3"/></g><g stroke="#4f46e5" stroke-opacity=".18" stroke-width="1"><line x1="100" x2="100" y1="0" y2="420"/><line x1="300" x2="300" y1="0" y2="420"/><line x1="600" x2="600" y1="0" y2="420"/><line x1="900" x2="900" y1="0" y2="420"/><line x1="1100" x2="1100" y1="0" y2="420"/><line x1="0" x2="1200" y1="100" y2="100"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="320" y2="320"/></g><g fill="none"><path stroke="#818cf8" stroke-opacity=".3" stroke-width="2" d="M 120 70 C 350 40, 450 140, 750 90 S 1080 60, 1150 110" class="anim-dash"/><path stroke="#c084fc" stroke-opacity=".3" stroke-width="2" d="M 80 350 C 320 380, 500 290, 800 340 S 1050 360, 1120 310" class=