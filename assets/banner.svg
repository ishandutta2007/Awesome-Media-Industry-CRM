<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a1438" />
    </linearGradient>

    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="badge-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="badge-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#581c87" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="badge-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="badge-grad-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#172554" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e3a5f" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes beamSlide {
        0% { transform: translateX(-600px); }
        100% { transform: translateX(1200px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .anim-pulse {
        animation: pulseGlow 6s ease-in-out infinite;
        transform-origin: center;
      }
      .anim-float-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .anim-float-2 {
        animation: floatReverse 6s ease-in-out infinite;
      }
      .anim-dash {
        stroke-dasharray: 6 6;
        animation: dashMove 3s linear infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.03em;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bg-grad)" />
  <rect width="1200" height="420" rx="20" fill="none" stroke="#374151" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Background Animated Atmospheric Glows -->
  <g class="anim-pulse" opacity="0.45">
    <circle cx="250" cy="120" r="140" fill="#6366f1" filter="url(#glow-blur)" />
    <circle cx="950" cy="300" r="160" fill="#a855f7" filter="url(#glow-blur)" />
    <circle cx="600" cy="210" r="120" fill="#ec4899" filter="url(#glow-blur)" opacity="0.3" />
  </g>

  <!-- Subtle Ambient Circuit Grid Lines -->
  <g stroke="#4f46e5" stroke-opacity="0.18" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1100" y1="0" x2="1100" y2="420" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Dynamic Animated Tech Data Paths (Background/Midground) -->
  <g fill="none">
    <path d="M 120 70 C 350 40, 450 140, 750 90 S 1080 60, 1150 110" stroke="#818cf8" stroke-opacity="0.3" stroke-width="2" class="anim-dash" />
    <path d="M 80 350 C 320 380, 500 290, 800 340 S 1050 360, 1120 310" stroke="#c084fc" stroke-opacity="0.3" stroke-width="2" class="anim-dash" />
  </g>

  <!-- Floating Dynamic Feature Pills (Midground, safe positions) -->
  <!-- Top Left Pill -->
  <g class="anim-float-1" transform="translate(80, 40)" filter="url(#subtle-shadow)">
    <rect width="180" height="38" rx="19" fill="url(#badge-grad-1)" stroke="#818cf8" stroke-width="1.2" />
    <circle cx="22" cy="19" r="6" fill="#818cf8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="24" fill="#e0e7ff" class="badge-text">📺 Broadcast &amp; Linear</text>
  </g>

  <!-- Top Right Pill -->
  <g class="anim-float-2" transform="translate(920, 45)" filter="url(#subtle-shadow)">
    <rect width="200" height="38" rx="19" fill="url(#badge-grad-2)" stroke="#c084fc" stroke-width="1.2" />
    <circle cx="22" cy="19" r="6" fill="#c084fc">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="24" fill="#f3e8ff" class="badge-text">🎯 Ad Sales &amp; Traffic</text>
  </g>

  <!-- Bottom Left Pill -->
  <g class="anim-float-2" transform="translate(100, 340)" filter="url(#subtle-shadow)">
    <rect width="215" height="38" rx="19" fill="url(#badge-grad-3)" stroke="#34d399" stroke-width="1.2" />
    <circle cx="22" cy="19" r="6" fill="#34d399">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="24" fill="#d1fae5" class="badge-text">📰 Subscription Lifecycle</text>
  </g>

  <!-- Bottom Right Pill -->
  <g class="anim-float-1" transform="translate(900, 340)" filter="url(#subtle-shadow)">
    <rect width="210" height="38" rx="19" fill="url(#badge-grad-4)" stroke="#60a5fa" stroke-width="1.2" />
    <circle cx="22" cy="19" r="6" fill="#60a5fa">
      <animate attributeName="opacity" values="0.6;1;0.6" dur="3.2s" repeatCount="indefinite" />
    </circle>
    <text x="38" y="24" fill="#dbeafe" class="badge-text">🔓 Open-Source Stacks</text>
  </g>

  <!-- Foreground Content Block: Title & Subtitle (Guaranteed in Foreground, No Overlaps) -->
  <g id="foreground-content" transform="translate(600, 195)">
    <!-- Category Pill Tag -->
    <g transform="translate(-165, -75)" filter="url(#subtle-shadow)">
      <rect width="330" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" />
      <text x="165" y="22" text-anchor="middle" fill="#a5b4fc" class="badge-text" font-size="12">✨ CURATED MEDIA TECH ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="-10" text-anchor="middle" fill="#ffffff" class="title-text" font-size="52" filter="url(#subtle-shadow)">
      Awesome Media Industry CRM
    </text>

    <!-- Gradient Accent Bar -->
    <rect x="-180" y="8" width="360" height="4" rx="2" fill="url(#primary-glow)">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Subtitle Line 1 -->
    <text x="0" y="44" text-anchor="middle" fill="#cbd5e1" class="subtitle-text" font-size="18">
      Top Commercial SaaS &amp; Open-Source CRM Tools for Media, Publishers &amp; Broadcasters
    </text>

    <!-- Subtitle Line 2 (Capabilities) -->
    <text x="0" y="74" text-anchor="middle" fill="#94a3b8" class="subtitle-text" font-size="14">
      Ad Order Management • Omnichannel Traffic • Paywalls &amp; Subscriptions • Sovereign Newsroom Data
    </text>
  </g>
</svg>
